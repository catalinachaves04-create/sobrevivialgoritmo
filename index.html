<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elige tu propia aventura: sobreviví al algoritmo</title>
<style>
:root {
  --bg: #efe0c8;
  --panel: #fbf3e4;
  --ink: #3a2314;
  --muted: #7a5a40;
  --accent: #a8691c;
  --accent-ink: #fff8ea;
  --floor: #e3cba6;
  --wall: #5a3a24;
  --line: #cfb48c;
}
html, body { height: 100%; margin: 0; padding: 0; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: Georgia, serif;
  line-height: 1.5;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  min-height: 100dvh;
  overflow: hidden;
}

/* Pantallas superpuestas */
.screen-view {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  text-align: center;
  background: var(--bg);
  z-index: 50;
}
#start-screen { background: radial-gradient(circle at center, var(--panel) 0%, var(--bg) 100%); z-index: 60; }
#intro-screen { background: #140a04; z-index: 70; }

.title-card {
  background: var(--panel);
  border: 3px solid var(--accent);
  border-radius: 16px;
  padding: 32px 24px;
  max-width: 520px;
  width: 100%;
  box-shadow: 0 12px 40px rgba(0,0,0,0.3);
}
h1.main-title { font-size: 26px; margin: 0 0 12px; color: var(--accent); }
p.subtitle { font-size: 16px; color: var(--muted); margin: 0 0 24px; }

.video-wrapper {
  max-width: 640px;
  width: 100%;
  border-radius: 12px;
  overflow: hidden;
  border: 3px solid var(--accent);
  background: #000;
  margin-bottom: 20px;
}
.video-wrapper video { width: 100%; height: auto; display: block; }

/* Contenedor del Juego */
#game-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 100%;
  max-width: 720px;
  padding: 10px;
}

header {
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 6px;
}
h1.game-head { font-size: 20px; margin: 0; }
.hud { display: flex; gap: 10px; align-items: center; font-size: 15px; }
.chip { background: var(--panel); border: 2px solid var(--line); border-radius: 999px; padding: 3px 12px; font-weight: 700; }
button { font: inherit; cursor: pointer; color: inherit; }
.btn {
  background: var(--accent);
  color: var(--accent-ink);
  border: 0;
  border-radius: 10px;
  padding: 12px 24px;
  font-weight: 700;
  font-size: 16px;
}

canvas {
  border: 3px solid var(--wall);
  border-radius: 8px;
  background: var(--floor);
  touch-action: none;
  max-width: 100%;
  display: block;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
#msg { margin: 6px 0 0; color: var(--muted); font-size: 15px; text-align: center; min-height: 22px; }

.pad {
  display: none;
  grid-template-columns: repeat(3,56px);
  grid-template-rows: repeat(2,56px);
  gap: 6px;
  margin-top: 6px;
}
.pad button { background: var(--panel); border: 2px solid var(--line); border-radius: 12px; font-size: 22px; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
.pad .u { grid-column: 2; }
@media (pointer:coarse), (hover:none){ .pad { display: grid; } }

/* Modales */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(20,10,4,.8);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  z-index: 100;
}
.card {
  background: var(--panel);
  border: 3px solid var(--accent);
  border-radius: 16px;
  max-width: 520px;
  width: 100%;
  padding: 22px;
  max-height: 92vh;
  overflow: auto;
}
.tag { font-weight: 700; color: var(--accent); margin-bottom: 8px; }
.card p { margin: 0 0 16px; font-size: 18px; }
.opts { display: grid; gap: 10px; }
.opt { display: flex; gap: 12px; text-align: left; background: transparent; border: 2px solid var(--line); border-radius: 10px; padding: 10px 12px; align-items: center; }
.opt b { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.bad .tag { color: #d0533d; }
.extra { border: 2px dashed var(--accent); border-radius: 12px; padding: 14px; margin: 0 0 16px; text-align: center; }
.qr { display: inline-block; background: #fff; padding: 10px; border-radius: 8px; margin: 8px 0 4px; }
.qr img, .qr canvas { display: block; }
.extra h2 { margin: 0 0 6px; font-size: 24px; }
.extra p { margin: 0 0 12px; font-size: 17px; }
.stage{position:relative;border:3px solid var(--accent);border-radius:14px;overflow:hidden;background:#4a2f1d}
.stage svg.bg{display:block;width:100%;height:auto}
.bar{position:absolute;left:0;top:0;height:5px;background:var(--accent);width:0;z-index:3}
.wall{fill:#7a4f30}.floor{fill:#4a2f1d}.frame{fill:#3a2314}.sky{fill:#cfe3ea}.street{fill:#9c8c78}
.counter{fill:#5a3a24}.ctop{fill:#a8733f}.mach{fill:#8f949a}.cup{fill:#f3e8d2}.shelf{fill:#3a2314}
.steam path{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;opacity:0;animation:st 3s ease-in-out infinite}
.steam path:nth-child(2){animation-delay:.9s}.steam path:nth-child(3){animation-delay:1.8s}
@keyframes st{0%{opacity:0;transform:translateY(8px)}40%{opacity:.8}100%{opacity:0;transform:translateY(-22px)}}
.sc{opacity:0;transition:opacity .6s;pointer-events:none}.sc.on{opacity:1}
.bob{animation:bob 3s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.on .clk{animation:pl 1.6s ease-in-out 3}@keyframes pl{50%{transform:scale(1.25)}}
.on .drop{animation:dr 1.4s ease-in 1s both}@keyframes dr{0%{transform:translateY(-80px);opacity:0}20%{opacity:1}100%{transform:none;opacity:1}}
.on .glow{animation:gl 2s ease both}@keyframes gl{from{opacity:0}to{opacity:.35}}
.bub rect{fill:#fff6e3;stroke:#a8691c;stroke-width:2}.bub text{font:700 15px Georgia,serif;fill:#3a2314}
.bub .x{fill:#c8402e;font-size:22px;opacity:0}
.on .bub{animation:bb 5.6s ease-in-out both;animation-delay:var(--d)}
.on .bub .x{animation:xx 5.6s both;animation-delay:var(--d)}
@keyframes bb{0%{transform:translateX(260px);opacity:0}18%{transform:none;opacity:1}62%{transform:none;opacity:1}100%{transform:translate(-170px,-24px) rotate(-8deg);opacity:0}}
@keyframes xx{0%,40%{opacity:0}55%,100%{opacity:1}}
.on .wk{animation:wk 8s linear both;animation-delay:var(--d)}@keyframes wk{from{transform:translateX(0)}to{transform:translateX(420px)}}
.on .gl{animation:gr 6.3s ease-in-out .3s both}@keyframes gr{0%{transform:none}35%,62%{transform:translateX(-250px)}100%{transform:translateX(60px)}}
.on .bell{animation:bl .5s ease-in-out 2.2s 6}@keyframes bl{50%{transform:rotate(18deg)}}
.cap{min-height:84px;font-size:21px;margin:0;text-align:center;max-width:62ch;align-self:center;transition:opacity .35s}
.ictl{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
.dots{display:flex;gap:7px}.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--accent)}
.paused *{animation-play-state:paused!important}

/* ===== Intro animada ===== */
#intro-screen{--panel:#2e1d12;--ink:#f3e4c9;--muted:#b99b78;--accent:#e0ad4a;--accent-ink:#241505;--line:#4f3624;color:var(--ink);overflow-y:auto;justify-content:flex-start;padding-top:max(20px,env(safe-area-inset-top));padding-bottom:max(20px,env(safe-area-inset-bottom))}
.intro-wrap{margin:auto;width:100%;max-width:860px;display:flex;flex-direction:column;gap:12px}
.ib{background:var(--panel);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:8px 14px}
.ib:focus-visible,#intro-screen .btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#intro-screen .btn{padding:10px 20px}
@media (prefers-reduced-motion:reduce){#intro-screen *{animation:none!important;transition:none!important}#intro-screen .sc.on .bub}
</style>
</head>
<body>

<!-- 1. Portada -->
<div id="start-screen" class="screen-view">
  <div class="title-card">
    <div style="font-size: 40px; margin-bottom: 8px;">☕</div>
    <h1 class="main-title">Elige tu propia aventura:<br>sobreviví al algoritmo</h1>
    <p class="subtitle">Defendé la tradición de tu cafetería frente a las demandas de las redes sociales.</p>
    <button class="btn" id="start-btn" type="button">Comenzar Aventura ➔</button>
  </div>
</div>

<!-- 2. Video Cutscene -->
<div id="intro-screen" class="screen-view" style="display: none;">
  <div class="intro-wrap">
    <div class="stage" id="stage">
      <div class="bar" id="bar"></div>
      <svg class="bg" id="svg" viewBox="0 0 800 450" role="img" aria-label="Animación de la historia de la cafetería"></svg>
    </div>
    <p class="cap" id="cap" aria-live="polite"></p>
    <div class="ictl">
      <button class="ib" id="prev" aria-label="Anterior" type="button">◀</button>
      <button class="ib" id="pp" type="button">⏸ Pausar</button>
      <button class="ib" id="next" aria-label="Siguiente" type="button">▶</button>
      <div class="dots" id="dots"></div>
    </div>
    <div class="ictl">
      <button class="ib" id="again" type="button" hidden>Ver de nuevo</button>
      <button class="btn" id="play-game-btn" type="button">Saltar e ir al juego ➔</button>
    </div>
  </div>
</div>

<!-- 3. Juego de Laberinto -->
<div id="game-container">
  <header>
    <h1 class="game-head">☕ Laberinto del café</h1>
    <div class="hud">
      <span class="chip" id="hud">Granos 0/4</span>
      <button class="btn" id="restart" style="padding: 4px 12px; font-size: 14px;" type="button">Reiniciar</button>
    </div>
  </header>

  <canvas id="cv" aria-label="Laberinto interactivo"></canvas>
  <p id="msg" aria-live="polite"></p>

  <div class="pad" aria-hidden="true">
    <button class="u" data-d="0" type="button">▲</button>
    <button data-d="3" style="grid-row:2;grid-column:1" type="button">◀</button>
    <button data-d="2" style="grid-row:2;grid-column:2" type="button">▼</button>
    <button data-d="1" style="grid-row:2;grid-column:3" type="button">▶</button>
  </div>
</div>

<!-- Modal de Decisiones -->
<div class="overlay" id="modal" hidden>
  <div class="card">
    <div class="tag" id="mtag"></div>
    <p id="mq"></p>
    <div id="mextra"></div>
    <div class="opts" id="mopts"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>

}

// ===== Intro animada (reemplaza al video) =====
(function(){

};

var T = [
  ["Son las cuatro de la tarde. El local huele a café tostado, a madera vieja y a granos recién molidos.", 6500],
  ["Sos la dueña de una cafetería de especialidad. Detrás de la barra, acomodás tazas de loza gruesa.", 6500],
  ["El mercado pide un espacio “aesthetic”, un perfil en redes con identidad, llegar a los clientes por Instagram. Vos te negás.", 8000],

  ["Pero el mundo de afuera cambia. Un día suena la campanita… y un grupo de chicas se va sin pedir nada.", 7000],
];

var cur = 0, el = 0, playing = false, done = false, LAST = T.length - 1;
var $i = function(i){ return document.getElementById(i); };
$i("dots").innerHTML = T.map(function(){ return "<i></i>"; }).join("");
function go(i){
  cur = Math.max(0, Math.min(LAST, i)); el = 0; done = false;
  document.querySelectorAll("#intro-screen .sc").forEach(function(g){ g.classList.toggle("on", +g.dataset.i === cur); });
  $i("cap").textContent = T[cur][0];
  $i("again").hidden = true;
  $i("play-game-btn").textContent = "Saltar e ir al juego ➔";
  document.querySelectorAll("#dots i").forEach(function(d, k){ d.classList.toggle("on", k === cur); });
  $i("bar").style.width = "0";
}
function finish(){
  done = true; $i("bar").style.width = "100%";
  $i("again").hidden = false;
  $i("play-game-btn").textContent = "Ir al juego ➔";
}
function nextScene(){ if (cur < LAST) go(cur + 1); else finish(); }
function setPlay(p){
  playing = p; $i("stage").classList.toggle("paused", !p);
  $i("pp").textContent = p ? "⏸ Pausar" : "▶ Seguir";
}
setInterval(function(){
  if (!playing || done) return;
  el += 100; $i("bar").style.width = Math.min(100, el / T[cur][1] * 100) + "%";

}, 100);
$i("prev").onclick = function(){ go(cur - 1); };
$i("next").onclick = nextScene;
$i("pp").onclick = function(){ setPlay(!playing); };
$i("again").onclick = function(){ go(0); setPlay(true); };
document.addEventListener("keydown", function(e){
  if ($i("intro-screen").style.display !== "flex") return;
  if (e.key === "ArrowRight") nextScene(); else if (e.key === "ArrowLeft") go(cur - 1);
  else if (e.key === " " && !/^(BUTTON|A)$/.test(document.activeElement.tagName)){ e.preventDefault(); setPlay(!playing); }
});
window.Intro = {
  start: function(){ go(0); setPlay(!matchMedia("(prefers-reduced-motion:reduce)").matches); },
  stop: function(){ setPlay(false); }
};
})();

// Inicialización segura garantizada
window.addEventListener("DOMContentLoaded", function() {
  document.getElementById("start-btn").addEventListener("click", function() {
    document.getElementById("start-screen").style.display = "none";
    document.getElementById("intro-screen").style.display = "flex";
    Intro.start();
  });
  document.getElementById("play-game-btn").addEventListener("click", function() {
    Intro.stop();
    document.getElementById("intro-screen").style.display = "none";
    resize();
    newGame();
  });
});

function gen(){
  var len;
  do {
    W = []; for (var r = 0; r < N; r++){ W[r] = []; for (var c = 0; c < N; c++) W[r][c] = [1,1,1,1]; }
    var seen = {}, st = [[0,0]]; seen["0,0"] = 1;
    while (st.length){
      var p = st[st.length-1], opts = [];
      for (var d = 0; d < 4; d++){ var nr = p[0]+DIRS[d][0], nc = p[1]+DIRS[d][1];
        if (nr >= 0 && nc >= 0 && nr < N && nc < N && !seen[nr+","+nc]) opts.push([d,nr,nc]); }
      if (!opts.length){ st.pop(); continue; }
      var o = opts[Math.floor(Math.random()*opts.length)];
      W[p[0]][p[1]][o[0]] = 0; W[o[1]][o[2]][(o[0]+2)%4] = 0; seen[o[1]+","+o[2]] = 1; st.push([o[1],o[2]]);
    }
    var par = { "0,0": null }, q = [[0,0]];
    for (var i = 0; i < q.length; i++){ var a = q[i];
      for (var d2 = 0; d2 < 4; d2++){ if (W[a[0]][a[1]][d2]) continue;
        var b = [a[0]+DIRS[d2][0], a[1]+DIRS[d2][1]], k = b[0]+","+b[1];
        if (!(k in par)){ par[k] = a; q.push(b); } } }
    path = []; var x = [N-1,N-1];
    while (x){ path.unshift(x); x = par[x[0]+","+x[1]]; }
    len = path.length;
  } while (len < 45);
  beans = [1,2,3,4].map(function(k){ var p = path[Math.floor(len*k/5)]; return { r: p[0], c: p[1], got: false }; });
}

function newGame(){
  gen(); pr = 0; pc = 0; mv = null; held = []; branch = null; pend = 0; modalOn = false; over = false; collected = 0;
  var modal = document.getElementById("modal");
  if(modal) modal.hidden = true;
  setMsg(ctrlHint());
  hud();
}

function hud(){ document.getElementById("hud").textContent = "Granos " + collected + "/4"; }
function setMsg(t){ document.getElementById("msg").textContent = t; }

function resize(){
  var coarse = isTouch();
  S = Math.max(240, Math.min(window.innerWidth - 30, window.innerHeight - (coarse ? 280 : 160), 720));
  var dpr = window.devicePixelRatio || 1;
  cv.style.width = cv.style.height = S + "px"; cv.width = cv.height = Math.round(S * dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0); cell = S / N;
}

function loadColors(){
  var cs = getComputedStyle(document.documentElement);
  var f = cs.getPropertyValue("--floor").trim(); if(f) C.floor = f;
  var w = cs.getPropertyValue("--wall").trim(); if(w) C.wall = w;
  var a = cs.getPropertyValue("--accent").trim(); if(a) C.accent = a;
}

function tryMove(d){
  var r = Math.round(pr), c = Math.round(pc);
  if (!W[r] || !W[r][c] || W[r][c][d]) return;
  mv = { fr: r, fc: c, tr: r + DIRS[d][0], tc: c + DIRS[d][1], t: 0 };
}

function arrive(){
  pr = mv.tr; pc = mv.tc; mv = null;
  for (var i = 0; i < beans.length; i++){
    var b = beans[i];
    if (!b.got && b.r === pr && b.c === pc){ b.got = true; collected++; hud(); openBean(i); return; }
  }
  if (pr === N-1 && pc === N-1 && pend === 2) ending(2);
}

function show(tag, text, opts, bad){
  modalOn = true; held = []; want = -1; sw = null; swDir = -1;
  var m = document.getElementById("modal"); m.hidden = false;
  m.firstElementChild.className = "card" + (bad ? " bad" : "");
  document.getElementById("mtag").textContent = tag;
  document.getElementById("mq").textContent = text;
  document.getElementById("mextra").innerHTML = "";
  var box = document.getElementById("mopts"); box.innerHTML = "";
  opts.forEach(function(o, i){
    var b = document.createElement("button"); b.className = "opt"; b.type = "button";
    b.innerHTML = "<b>" + (i+1) + "</b><span></span>"; b.lastChild.textContent = o[0];
    b.onclick = o[1]; box.appendChild(b);
  });
  if(box.firstChild) box.firstChild.focus();
}

function closeModal(){ document.getElementById("modal").hidden = true; modalOn = false; }

function openBean(i){
  curBean = i;
  var id = ["n1","n2", branch === "3A" ? "n3a" : "n3b", branch === "4A" ? "n4a" : "n4b"][i];
  node(id);
}

function node(id){
  var n = NODES[id];
  show("Grano " + (curBean+1) + " de 4", n.q, n.o.map(function(o){ return [o[0], function(){ pick(o[1]); }]; }));
}

function pick(t){
  if (t === "close") closeModal();
  else if (t.indexOf("node:") === 0) node(t.slice(5));
  else if (t.indexOf("b:") === 0){ branch = t.slice(2); closeModal(); }
  else if (t === "F1") ending(1);
  else if (t === "F2"){ pend = 2; closeModal(); setMsg("¡Buen camino! Llegá a la salida (OUT)."); }
}

function ending(n){
  over = true;
  show("Resultado final " + n, ENDS[n], [["Jugar de nuevo", newGame]], n === 1);
  var x = document.getElementById("mextra");
  if (n === 1){
    x.innerHTML = '<div class="extra"><p></p><button class="btn" id="free-btn" type="button">Aceptar el mes gratis</button></div>';
    var p = x.querySelector("p"), b = document.getElementById("free-btn");
    p.textContent = "Antes de bajar la persiana, te ofrecen una salida: 1 mes gratis en la plataforma recomendadora de cafeterías, para que más gente te encuentre.";
    b.onclick = function(){ p.textContent = "¡Mes gratis activado! Tu cafetería ya aparece en la plataforma recomendadora de cafeterías."; b.remove(); };
  } else {
    x.innerHTML = '<div class="extra"><h2>¿Es este el final?</h2><div class="qr" id="qr"></div><p>Escaneá el QR para seguir con la siguiente historia.</p></div>';
    var q = document.getElementById("qr");
    if (NEXT_STORY_QR_IMG){
      var im = document.createElement("img"); im.src = NEXT_STORY_QR_IMG; im.alt = "QR a la siguiente historia"; im.width = 140; im.height = 140; q.appendChild(im);
    } else {
      try { new QRCode(q, { text: NEXT_STORY_URL, width: 140, height: 140, colorDark: "#000000", colorLight: "#ffffff" }); }
      catch (e){ q.textContent = "QR próximamente"; }
    }
  }
}

function frame(t){
  var dt = Math.min(50, t - last); last = t;
  var isIntroVisible = document.getElementById("intro-screen").style.display !== 'none';
  var isStartVisible = document.getElementById("start-screen").style.display !== 'none';
  
  if (!modalOn && !over && !isIntroVisible && !isStartVisible){
    if (!mv){
      var wd = held.length ? held[held.length-1] : want;
      if (wd >= 0) tryMove(wd);
      want = -1;
    }
    if (mv){ mv.t += dt / 130; if (mv.t >= 1) arrive(); }
  }
  draw(t);
  requestAnimationFrame(frame);
}

function draw(t){
  loadColors();
  ctx.clearRect(0,0,S,S); 
  ctx.fillStyle = C.floor; 
  ctx.fillRect(0,0,S,S);

  if (!W || !W.length) return;

  var r, c;
  for (r = 0; r < N; r++) for (c = 0; c < N; c++) if ((r+c) % 2){ ctx.fillStyle = "rgba(0,0,0,.05)"; ctx.fillRect(c*cell, r*cell, cell, cell); }
  
  ctx.font = "bold " + cell*0.26 + "px Georgia,serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillStyle = "#2f9e57"; ctx.fillRect(0, 0, cell, cell);
  ctx.fillStyle = "#c8402e"; ctx.fillRect((N-1)*cell, (N-1)*cell, cell, cell);
  ctx.fillStyle = "#fff"; ctx.fillText("IN", cell/2, cell*0.2); ctx.fillText("OUT", (N-0.5)*cell, (N-1)*cell + cell*0.2);
  
  ctx.strokeStyle = C.wall; ctx.lineWidth = Math.max(2, cell*0.09); ctx.lineCap = "round"; ctx.beginPath();
  for (r = 0; r < N; r++) for (c = 0; c < N; c++){ var w = W[r][c], x = c*cell, y = r*cell;
    if (w[0]){ ctx.moveTo(x,y); ctx.lineTo(x+cell,y); } if (w[1]){ ctx.moveTo(x+cell,y); ctx.lineTo(x+cell,y+cell); }
    if (w[2]){ ctx.moveTo(x,y+cell); ctx.lineTo(x+cell,y+cell); } if (w[3]){ ctx.moveTo(x,y); ctx.lineTo(x,y+cell); } }
  ctx.stroke();

  if (beans){
    beans.forEach(function(b){
      if (b.got) return;
      var k = 1 + 0.12*Math.sin(t/250), cx = (b.c+0.5)*cell, cy = (b.r+0.5)*cell;
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(-0.6); ctx.scale(k,k);
      ctx.fillStyle = "#6b3a1e"; ctx.beginPath(); ctx.ellipse(0,0,cell*0.25,cell*0.17,0,0,7); ctx.fill();
      ctx.strokeStyle = "#e9c98f"; ctx.lineWidth = Math.max(1.5, cell*0.04);
      ctx.beginPath(); ctx.moveTo(-cell*0.22,0); ctx.quadraticCurveTo(0,-cell*0.1,cell*0.22,0); ctx.stroke(); ctx.restore();
    });
  }

  var fr = pr, fc = pc;
  if (mv){ var e = mv.t < 1 ? mv.t : 1; fr = mv.fr + (mv.tr - mv.fr)*e; fc = mv.fc + (mv.tc - mv.fc)*e; }
  ctx.font = cell*0.62 + "px serif"; ctx.fillStyle = "#000";
  ctx.fillText("☕", (fc+0.5)*cell, (fr+0.54)*cell);
}

document.addEventListener("keydown", function(e){
  if (modalOn){ var i = parseInt(e.key, 10) - 1, bs = document.querySelectorAll("#mopts .opt"); if (bs[i]) bs[i].click(); return; }
  if (e.key in KEYS){ e.preventDefault(); var d = KEYS[e.key]; if (held.indexOf(d) < 0) held.push(d); }
});
document.addEventListener("keyup", function(e){
  if (e.key in KEYS) held = held.filter(function(d){ return d !== KEYS[e.key]; });
});
document.querySelectorAll(".pad button").forEach(function(b){
  var d = +b.dataset.d;
  b.addEventListener("pointerdown", function(e){ e.preventDefault(); want = d; if (held.indexOf(d) < 0) held.push(d); });
  ["pointerup","pointerleave","pointercancel"].forEach(function(n){ b.addEventListener(n, function(){ held = held.filter(function(x){ return x !== d; }); }); });
});
document.getElementById("restart").onclick = newGame;

// Deslizar sobre el laberinto (solo táctil/lápiz; el mouse no mueve al personaje)
function setSwipe(d){
  held = held.filter(function(x){ return x !== swDir; });
  swDir = d;
  if (d >= 0){ held.push(d); want = d; }
}
cv.addEventListener("pointerdown", function(e){
  if (e.pointerType === "mouse" || modalOn || over) return;
  e.preventDefault();
  sw = { x: e.clientX, y: e.clientY, id: e.pointerId };
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
});
cv.addEventListener("pointermove", function(e){
  if (!sw || e.pointerId !== sw.id || modalOn || over) return;
  var dx = e.clientX - sw.x, dy = e.clientY - sw.y, T = Math.max(14, cell * 0.3);
  if (Math.abs(dx) < T && Math.abs(dy) < T) return;
  setSwipe(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0));
  sw.x = e.clientX; sw.y = e.clientY;
});
["pointerup", "pointercancel"].forEach(function(n){
  cv.addEventListener(n, function(){ sw = null; setSwipe(-1); });
});
window.addEventListener("orientationchange", function(){ setTimeout(resize, 250); });
window.addEventListener("resize", resize);

gen();
resize();
requestAnimationFrame(frame);
</script>
</body>
